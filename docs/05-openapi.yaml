          type: string
        data:
          $ref: '#/components/schemas/Review'
        traceId:
          type: string
      required:
      - code
      - message
      - data
      - traceId
    SalesTrendPoint:
      type: object
      additionalProperties: false
      description: 销售报表按DAY/WEEK/MONTH聚合的趋势点
      properties:
        periodStart:
          type: string
          format: date
          description: 当前统计区间起始日期
        receiptMinor:
          $ref: '#/components/schemas/Money'
        refundMinor:
          $ref: '#/components/schemas/Money'
        netReceiptMinor:
          type: string
          pattern: ^-?[0-9]+$
          description: 可能为负的人民币分字符串
        paidOrderCount:
          type: integer
          minimum: 0
      required:
      - periodStart
      - receiptMinor
      - refundMinor
      - netReceiptMinor
      - paidOrderCount
paths:
  /api/v1/auth/register:
    post:
      operationId: op001
      summary: 注册顾客
      tags:
      - 认证
      description: 权限：公开。注册只创建CUSTOMER，不接受角色或权限参数；用户名唯一。
      x-permission: 公开
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 主体+方法+路径作用域，同请求重放原结果；同键异请求409；建议UUID
        schema:
          type: string
          description: ''
          minLength: 16
          maxLength: 128
      security: []
      responses:
        '201':
          description: 成功；异步操作以data.state为准
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAccount'
        '400':
          description: 格式、缺少幂等键或参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未登录/令牌失效；回调签名无效时遵循渠道协议
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 权限或仓库范围不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在或不属于当前主体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等、状态、版本、库存或报价冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 金额/数量等业务条件不满足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 请求限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 依赖不可用或无法确定结果；客户端不能假定已失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
