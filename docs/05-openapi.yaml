      type: object
      additionalProperties: false
      description: 驳回时reason必填
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 驳回原因；APPROVE时可省略
      required:
      - action
    Review:
      type: object
      additionalProperties: false
      description: 公开接口只返回PUBLISHED评价；顾客展示名脱敏。审核原因仅按权限和状态返回。
      properties:
        id:
          $ref: '#/components/schemas/Id'
        productId:
          $ref: '#/components/schemas/Id'
        productName:
          type: string
        customerDisplayName:
          type: string
          description: 脱敏展示名
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
          maxLength: 2000
        imageAssetIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 5
        images:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
          maxItems: 5
        state:
          $ref: '#/components/schemas/ReviewState'
        moderationReason:
          type: string
          maxLength: 500
          nullable: true
        createdAt:
          $ref: '#/components/schemas/Time'
        publishedAt:
          $ref: '#/components/schemas/Time'
          nullable: true
        version:
          type: integer
          minimum: 0
      required:
      - id
      - productId
      - productName
      - customerDisplayName
      - rating
      - content
      - imageAssetIds
      - images
      - state
      - createdAt
      - version
    PageDataReview:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - total
    PageReview:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/PageDataReview'
        traceId:
          type: string
      required:
      - code
      - message
      - data
      - traceId
    ResultReview:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
