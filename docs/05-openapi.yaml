openapi: 3.0.3
info:
  title: 智采商城 API
  version: 0.2.0
  description:
    拟实现合同：单企业数码商城+多仓进销存。业务规则以02-需求文档.md为准。标准业务接口可用于生成客户端；支付/退款渠道原始回调入口标记为provider-specific-details-pending，选定沙箱后必须补齐。此文件不表示后端已经实现。
servers:
- url: http://localhost:8080
  description: 建议本地开发地址；尚未启动服务
tags:
- name: 认证
- name: 商品
- name: 地址
- name: 购物车
- name: 结算
- name: 订单
- name: 支付
- name: 售后
- name: 优惠券
- name: 后台商品
- name: 媒体
- name: 后台订单
- name: 后台售后
- name: 采购仓储
- name: 库存
- name: 采购
- name: 调拨
- name: 后台营销
- name: 资金
- name: 报表
- name: 通知
- name: 系统
- name: 渠道回调
- name: 商品评价
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 服务端随机可撤销令牌，非JWT；默认2小时，仅内存存储。
  schemas:
    Id:
      type: string
      description: 正整数字符串；数据库BIGINT主键，禁止前端转换为Number
      pattern: ^[1-9][0-9]{0,18}$
      example: '1001'
    Money:
      type: string
      description: 人民币分，非负整数字符串；Java long运算并检查溢出
      pattern: ^(0|[1-9][0-9]{0,17})$
      example: '129900'
    Time:
      type: string
      description: UTC时间，前端按Asia/Shanghai显示
      format: date-time
      example: '2026-10-20T08:00:00Z'
    Quantity:
      type: integer
      description: 数量
      minimum: 1
      maximum: 1000000
    OrderState:
      type: string
      description: ''
      enum:
      - UNPAID
      - CLOSING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELLED
    PaymentState:
      type: string
      description: ''
      enum:
      - CREATED
      - PROCESSING
      - SUCCEEDED
      - FAILED
      - CLOSED
    RefundState:
      type: string
      description: ''
      enum:
      - CREATED
      - PROCESSING
      - SUCCEEDED
      - FAILED
    PurchaseState:
      type: string
      description: ''
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - PART_RECEIVED
      - RECEIVED
      - REJECTED
      - CLOSED
    AfterSaleState:
      type: string
      description: ''
      enum:
      - REQUESTED
      - APPROVED
      - WAIT_RETURN
      - RECEIVED
      - REFUNDING
      - COMPLETED
      - REJECTED
      - CANCELLED
    TransferState:
      type: string
      description: ''
      enum:
      - DRAFT
      - SUBMITTED
      - APPROVED
      - SHIPPED
      - RECEIVED
      - REJECTED
      - CANCELLED
    JobState:
      type: string
      description: ''
      enum:
      - PENDING
      - RUNNING
      - SUCCEEDED
      - FAILED
    Ack:
      type: object
      additionalProperties: false
      description: ''
      properties:
        accepted:
          type: boolean
          description: 已完成本地操作；不是第三方支付/退款成功的保证
      required:
      - accepted
    ReasonRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        reason:
          type: string
          description: 原因或说明
          minLength: 1
          maxLength: 500
      required:
      - reason
    DecisionRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        approved:
          type: boolean
          description: ''
        reason:
          type: string
          description: 原因或说明
          minLength: 1
          maxLength: 500
      required:
      - approved
      - reason
    StatusRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        enabled:
          type: boolean
          description: ''
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - enabled
      - version
    FieldError:
      type: object
      additionalProperties: false
      description: ''
      properties:
        field:
          type: string
          description: ''
        message:
          type: string
          description: ''
      required:
      - field
      - message
    Error:
      type: object
      additionalProperties: false
      description: ''
      properties:
        code:
          type: string
          description: 业务错误码
        message:
          type: string
          description: 可读说明
        traceId:
          type: string
          description: ''
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: ''
      required:
      - code
      - message
      - traceId
    LoginRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        username: &id067
          type: string
          description: ''
          minLength: 3
          maxLength: 32
          pattern: ^[A-Za-z0-9_]{3,32}$
        password: &id068
          type: string
          description: 12–72 UTF-8字节，服务端另校验字节数
          minLength: 12
          maxLength: 72
          writeOnly: true
      required:
      - username
      - password
    RegisterRequest:
      $ref: '#/components/schemas/LoginRequest'
    Token:
      type: object
      additionalProperties: false
      description: ''
      properties:
        accessToken:
          type: string
          description: 不可预测随机令牌，仅HTTPS传输
        tokenType:
          type: string
          description: ''
          enum:
          - Bearer
        expiresAt:
          $ref: '#/components/schemas/Time'
      required:
      - accessToken
      - tokenType
      - expiresAt
    Account:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          description: ''
        displayName:
          type: string
          description: ''
        accountType:
          type: string
          description: ''
          enum:
          - CUSTOMER
          - STAFF
        permissions:
          type: array
          items:
            type: string
            description: ''
          description: ''
        warehouseIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: ''
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: ''
        enabled:
          type: boolean
          description: ''
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - id
      - username
      - displayName
      - accountType
      - permissions
      - warehouseIds
      - roleIds
      - enabled
      - version
    ProfileRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        displayName:
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
      required:
      - displayName
    PasswordRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        oldPassword:
          type: string
          description: ''
          writeOnly: true
        newPassword:
          type: string
          description: 12–72 UTF-8字节
          minLength: 12
          maxLength: 72
          writeOnly: true
      required:
      - oldPassword
      - newPassword
    AddressInput:
      type: object
      additionalProperties: false
      description: ''
      properties:
        recipient: &id001
          type: string
          description: ''
          minLength: 1
          maxLength: 50
        phone: &id002
          type: string
          description: 中国大陆演示手机号
          pattern: ^1[0-9]{10}$
        province: &id003
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        city: &id004
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        district: &id005
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        detail: &id006
          type: string
          description: ''
          minLength: 1
          maxLength: 200
        isDefault: &id007
          type: boolean
          description: ''
      required:
      - recipient
      - phone
      - province
      - city
      - district
      - detail
      - isDefault
    Address:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        recipient: *id001
        phone: *id002
        province: *id003
        city: *id004
        district: *id005
        detail: *id006
        isDefault: *id007
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - id
      - recipient
      - phone
      - province
      - city
      - district
      - detail
      - isDefault
      - version
    AddressUpdate:
      type: object
      additionalProperties: false
      description: ''
      properties:
        recipient: *id001
        phone: *id002
        province: *id003
        city: *id004
        district: *id005
        detail: *id006
        isDefault: *id007
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - recipient
      - phone
      - province
      - city
      - district
      - detail
      - isDefault
      - version
    CategoryInput:
      type: object
      additionalProperties: false
      description: ''
      properties:
        name: &id008
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        parentId: &id009
          $ref: '#/components/schemas/Id'
        sort: &id010
          type: integer
          description: ''
          minimum: 0
        enabled: &id011
          type: boolean
          description: ''
      required:
      - name
      - sort
      - enabled
    Category:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name: *id008
        parentId: *id009
        sort: *id010
        enabled: *id011
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - id
      - name
      - sort
      - enabled
      - version
    CategoryUpdate:
      type: object
      additionalProperties: false
      description: ''
      properties:
        name: *id008
        parentId: *id009
        sort: *id010
        enabled: *id011
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - name
      - sort
      - enabled
      - version
    BrandInput:
      type: object
      additionalProperties: false
      description: ''
      properties:
        name: &id012
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        enabled: &id013
          type: boolean
          description: ''
      required:
      - name
      - enabled
    Brand:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name: *id012
        enabled: *id013
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - id
      - name
      - enabled
      - version
    BrandUpdate:
      type: object
      additionalProperties: false
      description: ''
      properties:
        name: *id012
        enabled: *id013
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - name
      - enabled
      - version
    Spec:
      type: object
      additionalProperties: false
      description: ''
      properties:
        name:
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        value:
          type: string
          description: ''
          minLength: 1
          maxLength: 100
      required:
      - name
      - value
    SkuInput:
      type: object
      additionalProperties: false
      description: ''
      properties:
        code: &id014
          type: string
          description: ''
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
        specs: &id015
          type: array
          items:
            $ref: '#/components/schemas/Spec'
          description: ''
          minItems: 1
          maxItems: 10
        priceMinor: &id016
          $ref: '#/components/schemas/Money'
        enabled: &id017
          type: boolean
          description: ''
      required:
      - code
      - specs
      - priceMinor
      - enabled
    Sku:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        productId:
          $ref: '#/components/schemas/Id'
        code: *id014
        specs: *id015
        priceMinor: *id016
        enabled: *id017
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - id
      - productId
      - code
      - specs
      - priceMinor
      - enabled
      - version
    SkuUpdate:
      type: object
      additionalProperties: false
      description: ''
      properties:
        code: *id014
        specs: *id015
        priceMinor: *id016
        enabled: *id017
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - code
      - specs
      - priceMinor
      - enabled
      - version
    ProductInput:
      type: object
      additionalProperties: false
      description: ''
      properties:
        name: &id018
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        categoryId: &id019
          $ref: '#/components/schemas/Id'
        brandId: &id020
          $ref: '#/components/schemas/Id'
        imageAssetIds: &id021
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: ''
          minItems: 1
          maxItems: 10
        description: &id022
          type: string
          description: 纯文本或受限Markdown，展示时转义
          maxLength: 10000
        featured: &id023
          type: boolean
          description: ''
      required:
      - name
      - categoryId
      - brandId
      - imageAssetIds
      - description
      - featured
    ProductUpdate:
      type: object
      additionalProperties: false
      description: ''
      properties:
        name: *id018
        categoryId: *id019
        brandId: *id020
        imageAssetIds: *id021
        description: *id022
        featured: *id023
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - name
      - categoryId
      - brandId
      - imageAssetIds
      - description
      - featured
      - version
    Product:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name: *id018
        categoryId: *id019
        brandId: *id020
        imageAssetIds: *id021
        description: *id022
        featured: *id023
        ratingAverage:
          type: number
          format: double
          minimum: 0
          maximum: 5
          description: 仅统计PUBLISHED评价，保留两位小数；无公开评价时为0
        ratingCount:
          type: integer
          minimum: 0
          description: 仅统计PUBLISHED评价数量
        state:
          type: string
          description: ''
          enum:
          - DRAFT
          - ON_SALE
          - OFF_SALE
        images:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
          description: ''
        skus:
          type: array
          items:
            $ref: '#/components/schemas/Sku'
          description: ''
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - name
      - categoryId
      - brandId
      - imageAssetIds
      - description
      - featured
      - state
      - images
      - skus
      - version
      - createdAt
      - ratingAverage
      - ratingCount
    ProductStateRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        state:
          type: string
          description: ''
          enum:
          - ON_SALE
          - OFF_SALE
        version:
          type: integer
          description: 乐观锁版本，冲突返回409
          minimum: 0
      required:
      - state
      - version
    Asset:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          description: ''
          format: uri
        contentType:
          type: string
          description: ''
        sizeBytes:
          type: integer
          description: ''
          minimum: 0
      required:
      - id
      - url
      - contentType
      - sizeBytes
    CartInput:
      type: object
      additionalProperties: false
      description: ''
      properties:
        skuId:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          description: ''
          minimum: 1
          maximum: 99
      required:
      - skuId
      - quantity
    CartUpdate:
      type: object
      additionalProperties: false
      description: ''
      properties:
        quantity:
          type: integer
          description: ''
          minimum: 1
          maximum: 99
        selected:
          type: boolean
          description: ''
      required:
      - quantity
      - selected
    CartLine:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        skuId:
          $ref: '#/components/schemas/Id'
        productName:
          type: string
          description: ''
        specs:
          type: array
          items:
            $ref: '#/components/schemas/Spec'
          description: ''
        priceMinor:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          description: ''
          minimum: 1
        selected:
          type: boolean
          description: ''
        valid:
          type: boolean
          description: ''
        invalidReason:
          type: string
          description: ''
      required:
      - id
      - skuId
      - productName
      - specs
      - priceMinor
      - quantity
      - selected
      - valid
    QuoteRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        addressId:
          $ref: '#/components/schemas/Id'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartInput'
          description: ''
          minItems: 1
          maxItems: 100
        couponId:
          $ref: '#/components/schemas/Id'
      required:
      - addressId
      - items
    QuoteLine:
      type: object
      additionalProperties: false
      description: ''
      properties:
        skuId: &id024
          $ref: '#/components/schemas/Id'
        productName: &id025
          type: string
          description: ''
        specs: &id026
          type: array
          items:
            $ref: '#/components/schemas/Spec'
          description: ''
        quantity: &id027
          $ref: '#/components/schemas/Quantity'
        unitPriceMinor: &id028
          $ref: '#/components/schemas/Money'
        grossMinor: &id029
          $ref: '#/components/schemas/Money'
        discountMinor: &id030
          $ref: '#/components/schemas/Money'
        payableMinor: &id031
