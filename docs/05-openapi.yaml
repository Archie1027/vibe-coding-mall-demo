      properties:
        orderItemId:
          $ref: '#/components/schemas/Id'
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: 1–5星整数评分
        content:
          type: string
          maxLength: 2000
          description: 可选文字；可为空字符串
        imageAssetIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 0
          maxItems: 5
          description: 可选评价图片，最多5张
      required:
      - orderItemId
      - rating
    ReviewUpdate:
      type: object
      additionalProperties: false
      description: 仅用于原作者修改被驳回的评价并重新提交
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        content:
          type: string
          maxLength: 2000
        imageAssetIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 0
          maxItems: 5
        version:
          type: integer
          minimum: 0
          description: 乐观锁版本，冲突返回409
      required:
      - rating
      - content
      - imageAssetIds
      - version
