      security: []
      responses:
        '200':
          description: 服务商要求的成功ACK格式待补充；不能默认使用统一JSON信封
        default:
          description: 按所选服务商协议应答；验签失败不落账，服务暂时故障应允许渠道重试
      requestBody:
        required: true
        content:
