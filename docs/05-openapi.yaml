          items:
            $ref: '#/components/schemas/QuoteLine'
          description: ''
        grossMinor:
          $ref: '#/components/schemas/Money'
        discountMinor:
          $ref: '#/components/schemas/Money'
        shippingMinor:
          $ref: '#/components/schemas/Money'
        payableMinor:
          $ref: '#/components/schemas/Money'
        couponId:
          $ref: '#/components/schemas/Id'
        expiresAt:
          $ref: '#/components/schemas/Time'
      required:
      - id
      - warehouseId
      - items
      - grossMinor
      - discountMinor
      - shippingMinor
      - payableMinor
      - expiresAt
    OrderCreate:
      type: object
      additionalProperties: false
      description: ''
      properties:
        quoteId:
          $ref: '#/components/schemas/Id'
        remark:
          type: string
          description: ''
          maxLength: 200
      required:
      - quoteId
    OrderLine:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        skuId: *id024
        productName: *id025
        specs: *id026
        quantity: *id027
        unitPriceMinor: *id028
        grossMinor: *id029
        discountMinor: *id030
        payableMinor: *id031
        returnedQuantity:
