        refundedMinor:
          $ref: '#/components/schemas/Money'
      required:
      - id
      - skuId
      - productName
      - specs
      - quantity
      - unitPriceMinor
      - grossMinor
      - discountMinor
      - payableMinor
      - returnedQuantity
      - refundedMinor
    Shipment:
      type: object
      additionalProperties: false
      description: ''
      properties:
        carrier:
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        trackingNo:
          type: string
          description: ''
          minLength: 1
          maxLength: 64
        shippedAt:
          $ref: '#/components/schemas/Time'
      required:
      - carrier
      - trackingNo
      - shippedAt
    ShipRequest:
      type: object
      additionalProperties: false
      description: ''
      properties:
        carrier:
          type: string
          description: 名称
          minLength: 1
          maxLength: 120
        trackingNo:
          type: string
          description: ''
          minLength: 1
          maxLength: 64
      required:
      - carrier
      - trackingNo
    Order:
      type: object
      additionalProperties: false
      description: ''
      properties:
        id:
          $ref: '#/components/schemas/Id'
        orderNo:
          type: string
          description: ''
        customerId:
          $ref: '#/components/schemas/Id'
        warehouseId:
          $ref: '#/components/schemas/Id'
        state:
          $ref: '#/components/schemas/OrderState'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          description: ''
        addressSnapshot:
          $ref: '#/components/schemas/AddressInput'
        grossMinor:
          $ref: '#/components/schemas/Money'
        discountMinor:
          $ref: '#/components/schemas/Money'
        shippingMinor:
          $ref: '#/components/schemas/Money'
        payableMinor:
          $ref: '#/components/schemas/Money'
        refundedMinor:
          $ref: '#/components/schemas/Money'
        expiresAt:
          $ref: '#/components/schemas/Time'
        createdAt:
          $ref: '#/components/schemas/Time'
        paidAt:
          $ref: '#/components/schemas/Time'
        completedAt:
